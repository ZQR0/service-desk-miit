<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
    <link rel="stylesheet" th:href="@{/css/request-details.css}">
</head>
<body>
<main class="page">
    <h1>Вход в сервис-деск</h1>
    <form th:action="@{/login}" method="post" class="card">
        <label>Логин <input name="username" required></label>
        <label>Пароль <input name="password" type="password" required></label>
        <button type="submit">Войти</button>
    </form>
</main>
</body>
</html>
